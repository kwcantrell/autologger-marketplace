# The marketplace's one CI gate. The job id `ci` is the check name the `main protection` ruleset
# requires (scripts/harden-repo.ts, CI_CHECK); renaming the job breaks every PR's required check.
# Every `uses:` is pinned to a full commit SHA with its tag in a comment; Dependabot keeps them
# current. `claude plugin validate` is not run here: the `claude` CLI is not on GitHub's runners
# (plugin-builder's tests skip their real-claude case when it is missing).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # A full run takes about a minute. A hang fails the job instead of running to GitHub's 6 h limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so check-versions can find the PR base or the push's before SHA.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dev tooling
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        # npm test sets --test-timeout, which fails a test that never settles, with its name. A test
        # blocked in synchronous code (spawnSync, a busy loop) cannot be interrupted by it; this
        # step timeout stops that case.
        timeout-minutes: 10
        run: npm test
      - name: Plugin convention check
        run: node plugins/plugin-builder/src/cli.ts check --all
      - name: Plugin versions bumped
        # Every change under plugins/<name>/ must raise that plugin's version (Claude Code caches
        # plugins by version). A pull request compares against its base; a push to main (including
        # one by the admin bypass) against the push's before SHA, or the first parent when that is
        # all zeros. The SHA comes in through env, never spliced into the script.
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-versions.ts --base "$BASE_SHA"
